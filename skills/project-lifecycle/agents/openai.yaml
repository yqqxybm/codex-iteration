interface:
  display_name: "Project Lifecycle"
  short_description: "Software project lifecycle and execution controller."
  default_prompt: >
    Use $project-lifecycle as the single entry point to classify this software
    project request, requirement, correction, user-facing product/content
    change, or Codex behavior-control change. Locate the earliest unresolved
    project commitment, then build the complete owner-skill chain to the
    requested outcome; later action verbs never waive missing upstream state.
    Apply the visible analysis gate only when its boundary requires it and
    preserve user boundaries. Route unresolved user/product reality through
    project-discovery and unresolved product commitment through project-brief
    before implementation. For an explicit software goal, enact the universal
    $goal owner and this lifecycle in the same main thread, loading the software
    goal adapter without duplicating analysis, goal state, scheduling, or
    completion ownership.
    For independent surfaces, load the subagent reference and parallelize unless
    a concrete blocker exists. The subagent references remain authoritative for
    model-routing, CAO, receipt, join, and thread behavior; $goal is
    authoritative for native goal state and whole-commission completion.
